<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Dungeon RPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <h1>Chronicles of the Ember Gate</h1>
      <div class="top-actions">
        <span id="modeBadge" class="badge"></span>
        <button id="dailyBtn" class="ghost-btn">Daily Challenge</button>
        <button id="themeToggle" class="ghost-btn">🌙 Theme</button>
      </div>
    </header>

    <main class="layout">
      <section class="game-panel">
        <div class="status-row">
          <div class="bar-wrapper">
            <span>HP <strong id="hpLabel">100/100</strong></span>
            <div class="progress danger"><div id="hpBar"></div></div>
          </div>
          <div class="bar-wrapper">
            <span>MP <strong id="mpLabel">60/60</strong></span>
            <div class="progress mana"><div id="mpBar"></div></div>
          </div>
        </div>

        <div id="bossPanel" class="boss-panel hidden">
          <span id="bossName">Boss</span>
          <div class="progress boss"><div id="bossBar"></div></div>
        </div>

        <section id="narrative" class="narrative"></section>

        <form id="actionForm" class="action-box">
          <input id="actionInput" placeholder="Type action (go north, attack, cast spell, help iron legion)" autocomplete="off" />
          <button type="submit">Act</button>
        </form>

        <div class="controls">
          <button id="inventoryBtn">Inventory</button>
          <button id="sheetBtn">Character Sheet</button>
          <button id="saveBtn">Save</button>
          <button id="loadBtn">Load</button>
          <button id="soundToggle">🔊</button>
        </div>
      </section>

      <aside class="side-panel">
        <section class="panel-block">
          <h3>Mini Map</h3>
          <div id="miniMap" class="mini-map"></div>
        </section>
        <section class="panel-block">
          <h3>Skill Tree (<span id="skillPoints">0</span>)</h3>
          <div id="skillTree" class="skill-tree"></div>
        </section>
        <section class="panel-block">
          <h3>Event Log</h3>
          <ul id="eventLog" class="event-log"></ul>
        </section>
        <section class="panel-block">
          <h3>Daily Leaderboard</h3>
          <ol id="leaderboard" class="leaderboard"></ol>
        </section>
      </aside>
    </main>
  </div>

  <aside id="inventoryPanel" class="inventory-panel hidden">
    <h2>Inventory</h2>
    <ul id="inventoryList"></ul>
  </aside>

  <div id="allocationModal" class="modal open">
    <div class="modal-content">
      <h2>New Adventure Setup</h2>
      <label>Name <input id="playerName" value="Adventurer" maxlength="24" /></label>
      <p>Spend exactly 5 starting stat points.</p>
      <div class="allocation-grid" id="allocationGrid"></div>
      <p id="pointsRemaining">Points Remaining: 5</p>
      <div class="mode-row">
        <label><input type="checkbox" id="hardcoreMode" /> 💀 Hardcore Mode</label>
        <label><input type="checkbox" id="ngPlusMode" /> NG+</label>
        <label><input type="checkbox" id="dailyMode" /> Daily Challenge</label>
      </div>
      <button id="startGameBtn">Begin Adventure</button>
    </div>
  </div>

  <div id="sheetModal" class="modal">
    <div class="modal-content large">
      <h2>Character Sheet</h2>
      <div id="sheetContent"></div>
      <button id="closeSheetBtn">Close</button>
    </div>
  </div>

  <div id="loading" class="loading hidden"><div class="spinner"></div><span>Oracle is writing fate...</span></div>
  <div id="popupContainer" class="popup-container"></div>
  <script src="script.js"></script>
</body>
</html>

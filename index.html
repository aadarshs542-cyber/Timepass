<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Object Personality Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card" aria-live="polite">
      <h1>Object Personality Generator</h1>
      <p class="intro">Click the button to discover your quirky object-powered personality.</p>
      <button id="generateBtn" type="button">Generate Personality</button>

      <div id="result" class="result hidden">
        <h2 id="personalityTitle"></h2>

        <div class="objects">
          <h3>Your 3 objects</h3>
          <ul id="objectList"></ul>
        </div>

        <p id="description"></p>

        <div class="details">
          <div>
            <h3>Strengths</h3>
            <ul id="strengthList"></ul>
          </div>

          <div>
            <h3>Weakness</h3>
            <p id="weakness"></p>
          </div>

          <div>
            <h3>Life Motto</h3>
            <p id="motto"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
